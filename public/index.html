<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YaranaChat — Secure Messaging by Sharma Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .bg-communication-mesh {
      background-color: #03050c;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(249, 115, 22, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      bottom: -20px;
      background: rgba(249, 115, 22, 0.5);
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.9);
      animation: floatParticle 7s infinite linear;
      border-radius: 50%;
    }
    .floating-card {
      animation: floatCard 6s ease-in-out infinite;
    }
    .glass-card {
      background: rgba(12, 16, 28, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -10px rgba(249, 115, 22, 0.3);
    }
  </style>
</head>
<body class="bg-[#03050c] text-gray-100 h-screen flex flex-col overflow-hidden font-sans selection:bg-orange-500 selection:text-white relative">

  <div class="bg-communication-mesh">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#f97316_1.5px,transparent_1.5px)] [background-size:28px_28px]"></div>
    <div class="particle" style="left: 10%; width: 6px; height: 6px; animation-delay: 0s; animation-duration: 6s;"></div>
    <div class="particle" style="left: 25%; width: 5px; height: 5px; animation-delay: 2s; animation-duration: 8s;"></div>
    <div class="particle" style="left: 45%; width: 8px; height: 8px; animation-delay: 1s; animation-duration: 5s;"></div>
    <div class="particle" style="left: 65%; width: 6px; height: 6px; animation-delay: 3s; animation-duration: 7s;"></div>
    <div class="particle" style="left: 85%; width: 7px; height: 7px; animation-delay: 1.5s; animation-duration: 9s;"></div>
  </div>

  <div id="app" class="flex flex-col h-full w-full relative z-10"></div>

  <script>
    const socket = io();
    let currentUser = null;
    let activeChatUser = null;
    let messages = [];
    let searchResults = [];
    let searchQuery = '';
    let feedbackText = '';
    let showFeedbackModal = false;
    let activeLegalModal = null;
    let soundEnabled = true;

    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.error('Audio playback error:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      render();
    }

    window.handleGoogleSignIn = async function(response) {
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        const googleUser = JSON.parse(jsonPayload);
        
        currentUser = { 
          _id: googleUser.sub, 
          name: googleUser.name, 
          email: googleUser.email,
          picture: googleUser.picture,
          friends: [],
          pendingRequests: [],
          sentRequests: []
        };
        
        socket.emit('join_room', currentUser);
        await refreshUserData();
        render();
      } catch (e) {
        console.error('Google Auth decoding error:', e);
      }
    };

    async function refreshUserData() {
      if (!currentUser) return;
      try {
        const res = await fetch(`/api/user/${currentUser._id}`);
        if (res.ok) {
          const data = await res.json();
          currentUser.friends = data.friends || [];
          currentUser.pendingRequests = data.pendingRequests || [];
          currentUser.sentRequests = data.sentRequests || [];
        }
      } catch (err) {
        console.error('Failed to sync user data', err);
      }
    }

    function logout() {
      currentUser = null;
      activeChatUser = null;
      messages = [];
      searchResults = [];
      searchQuery = '';
      render();
    }

    function handleSearchInput(e) {
      searchQuery = e.target.value;
    }

    async function executeSearch() {
      if (!searchQuery.trim()) {
        searchResults = [];
        render();
        return;
      }
      try {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(searchQuery)}&currentUserId=${currentUser._id}`);
        searchResults = await res.json();
        render();
      } catch (err) { 
        console.error(err); 
        searchResults = [];
        render();
      }
    }

    function sendFriendRequest(recipientId) {
      socket.emit('send_friend_request', { senderId: currentUser._id, recipientId });
    }

    function acceptFriendRequest(requesterId) {
      socket.emit('accept_friend_request', { userId: currentUser._id, requesterId });
    }

    async function selectChat(id, name) {
      activeChatUser = { _id: id, name: name };
      try {
        const res = await fetch(`/api/messages/${currentUser._id}/${id}`);
        if (res.ok) {
          messages = await res.json();
        } else {
          messages = [];
        }
      } catch (err) {
        messages = [];
      }
      render();
    }

    function toggleFeedback(isOpen) {
      showFeedbackModal = isOpen;
      if (!isOpen) feedbackText = '';
      render();
    }

    function handleFeedbackInput(e) {
      feedbackText = e.target.value;
    }

    function openLegal(type) {
      activeLegalModal = type;
      render();
    }

    function closeLegal() {
      activeLegalModal = null;
      render();
    }

    async function submitFeedback() {
      if (!feedbackText || !feedbackText.trim()) return;
      try {
        await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: currentUser.name, email: currentUser.email, message: feedbackText })
        });
        alert('Feedback submitted successfully!');
        toggleFeedback(false);
      } catch (err) {
        console.error(err);
      }
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      if (!input || !input.value.trim() || !activeChatUser) return;
      playNotificationSound();
      socket.emit('send_message', {
        sender: currentUser._id,
        recipient: activeChatUser._id,
        text: input.value
      });
      input.value = '';
    }

    socket.on('friend_request_sent', async ({ recipientId }) => {
      await refreshUserData();
      render();
    });

    socket.on('friend_request_received', async ({ senderId }) => {
      await refreshUserData();
      playNotificationSound();
      render();
    });

    socket.on('friend_request_accepted', async ({ friendId }) => {
      await refreshUserData();
      playNotificationSound();
      render();
    });

    socket.on('receive_message', (msg) => {
      if (activeChatUser && (msg.sender === activeChatUser._id || msg.recipient === activeChatUser._id)) {
        if (!messages.some(m => m._id === msg._id)) {
          messages.push(msg);
          if (msg.sender !== currentUser._id) {
            playNotificationSound();
          }
          render();
        }
      }
    });

    async function render() {
      if (currentUser) {
        await refreshUserData();
      }
      const app = document.getElementById('app');
      
      if (!currentUser) {
        app.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center p-6 overflow-y-auto">
            <div class="max-w-md w-full glass-card p-8 rounded-3xl text-center shadow-2xl space-y-6 floating-card">
              <div class="w-16 h-16 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-orange-600/40 text-white font-bold text-2xl">YC</div>
              <div>
                <h1 class="text-2xl font-black tracking-tight text-white">YaranaChat</h1>
                <p class="text-[11px] text-orange-400 font-bold tracking-wider mt-1">SECURE GLOBAL COMMUNICATIONS</p>
              </div>

              <div class="pt-2 flex flex-col items-center justify-center space-y-4">
                <div id="g_id_onload"
                     data-client_id="580182481566-ohhluh51udp8kc3i31jrb3oqgli1hksb.apps.googleusercontent.com"
                     data-callback="handleGoogleSignIn"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="filled_black"
                     data-text="sign_in_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
              </div>

              <div class="pt-4 border-t border-white/10 flex flex-wrap justify-center gap-3 text-xs text-gray-400">
                <a href="https://youtube.com/@sharmaacademy" target="_blank" class="hover:text-orange-400 transition">Sharma Academy YT</a>
                <span>•</span>
                <a href="https://github.com/sharma1947" target="_blank" class="hover:text-orange-400 transition">GitHub (sharma1947)</a>
                <span>•</span>
                <span class="text-orange-400 font-semibold">Sharma Group Ecosystem</span>
              </div>
            </div>
          </div>`;
        
        setTimeout(() => {
          if (window.google && window.google.accounts) {
            try {
              google.accounts.id.initialize({
                client_id: "580182481566-ohhluh51udp8kc3i31jrb3oqgli1hksb.apps.googleusercontent.com",
                callback: window.handleGoogleSignIn
              });
              const signInDiv = document.querySelector(".g_id_signin");
              if (signInDiv && signInDiv.childElementCount === 0) {
                google.accounts.id.renderButton(
                  signInDiv,
                  { theme: "filled_black", size: "large", shape: "pill" }
                );
              }
            } catch(err) { console.error(err); }
          }
        }, 100);
        return;
      }

      app.innerHTML = `
        <header class="h-16 border-b border-white/10 bg-[#0c101c]/90 backdrop-blur px-6 flex items-center justify-between shrink-0 shadow-lg">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-bold text-white text-xs">YC</div>
            <div>
              <h1 class="font-bold text-sm tracking-wide">YaranaChat</h1>
              <p class="text-[9px] text-orange-400 font-bold">BY SHARMA GROUP</p>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <button onclick="toggleSound()" class="px-3.5 py-1.5 bg-[#1a2338] hover:bg-[#25324e] border border-white/5 rounded-full text-xs font-medium transition cursor-pointer">
              ${soundEnabled ? '🔔 Sound ON' : '🔕 Sound OFF'}
            </button>
            <button onclick="toggleFeedback(true)" class="px-4 py-1.5 bg-[#1a2338] hover:bg-[#25324e] border border-white/5 rounded-full text-xs font-medium transition cursor-pointer">Feedback</button>
            <span class="px-4 py-1.5 bg-[#1a2338] border border-white/5 rounded-full text-xs font-medium text-orange-300">${currentUser.name}</span>
            <button onclick="logout()" class="px-4 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/20 rounded-full text-xs font-medium transition cursor-pointer">Logout</button>
          </div>
        </header>

        <div class="flex-1 flex overflow-hidden p-6 gap-6 max-w-[1600px] w-full mx-auto">
          <div class="w-80 glass-card rounded-2xl flex flex-col overflow-hidden shadow-xl shrink-0">
            <div class="p-4 border-b border-white/10 space-y-3">
              <p class="text-[11px] font-semibold tracking-wider text-gray-400 uppercase">Search User</p>
              <div class="space-y-2">
                <input type="text" placeholder="Enter name or email..." value="${searchQuery}" oninput="handleSearchInput(event)" class="w-full bg-[#03050c] border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white outline-none focus:border-orange-500">
                <button onclick="executeSearch()" class="w-full py-2 bg-[#25324a] hover:bg-[#2f3f5e] border border-white/5 rounded-xl text-xs font-semibold transition cursor-pointer">Search</button>
              </div>
            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-6">
              ${searchResults.length > 0 ? `
                <div>
                  <p class="text-[11px] font-semibold tracking-wider text-orange-400 uppercase mb-2">Search Results</p>
                  <div class="space-y-2">
                    ${searchResults.map(u => {
                      const isFriend = currentUser.friends.includes(u._id);
                      const sentAlready = currentUser.sentRequests.includes(u._id);
                      const hasIncoming = currentUser.pendingRequests.includes(u._id);
                      return `
                        <div class="p-3 bg-[#161d2f] border border-white/5 rounded-xl flex items-center justify-between">
                          <div class="truncate mr-2">
                            <p class="text-xs font-bold text-white truncate">${u.name}</p>
                            <p class="text-[10px] text-gray-400 truncate">${u.email}</p>
                          </div>
                          <div>
                            ${isFriend ? '<span class="text-[10px] text-green-400 font-bold">Friends</span>' : 
                              sentAlready ? '<span class="text-[10px] text-amber-400 font-bold">Requested</span>' :
                              hasIncoming ? `<button onclick="acceptFriendRequest('${u._id}')" class="px-2.5 py-1 bg-green-600 text-white rounded-lg text-[10px] font-bold cursor-pointer">Accept</button>` :
                              `<button onclick="sendFriendRequest('${u._id}')" class="px-2.5 py-1 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-[10px] font-bold cursor-pointer">+ Add</button>`
                            }
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : ''}

              ${currentUser.pendingRequests.length > 0 ? `
                <div>
                  <p class="text-[11px] font-semibold tracking-wider text-amber-400 uppercase mb-2">Pending Friend Requests</p>
                  <div class="space-y-2">
                    ${currentUser.pendingRequests.map(reqId => `
                      <div class="p-3 bg-[#1e1c16] border border-amber-500/20 rounded-xl flex items-center justify-between">
                        <span class="text-xs font-medium text-amber-200">User ID: ${reqId.substring(0,8)}...</span>
                        <button onclick="acceptFriendRequest('${reqId}')" class="px-3 py-1 bg-green-600 text-white rounded-lg text-[10px] font-bold cursor-pointer">Accept</button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <div>
                <p class="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-2">My Friends List (${currentUser.friends.length})</p>
                <div class="space-y-2">
                  ${currentUser.friends.length === 0 ? '<p class="text-xs text-gray-500">No friends added yet. Search a user to connect.</p>' : ''}
                  ${currentUser.friends.map(fId => `
                    <div onclick="selectChat('${fId}', 'Friend (${fId.substring(0,6)})')" class="p-3 bg-[#161d2f] hover:bg-[#1e273d] border border-white/5 rounded-xl cursor-pointer transition ${activeChatUser?._id === fId ? 'border-orange-500/50 bg-[#1e273d]' : ''}">
                      <p class="text-xs font-bold text-white">Chat Connection</p>
                      <p class="text-[10px] text-gray-400 truncate">ID: ${fId}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="flex-1 glass-card rounded-2xl flex flex-col overflow-hidden shadow-xl">
            ${activeChatUser ? `
              <div class="p-4 border-b border-white/10 bg-[#121826] flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-xs">${activeChatUser.name[0]}</div>
                <h3 class="font-bold text-sm">${activeChatUser.name}</h3>
              </div>
              <div class="flex-1 p-6 overflow-y-auto space-y-3">
                ${messages.map(m => `
                  <div class="flex ${m.sender === currentUser._id ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-md px-4 py-2.5 rounded-2xl text-xs ${m.sender === currentUser._id ? 'bg-orange-600 text-white rounded-br-none shadow-md' : 'bg-[#182136] text-gray-200 rounded-bl-none border border-white/5'}">
                      ${m.text}
                    </div>
                  </div>
                `).join('')}
              </div>
              <form onsubmit="sendMessage(event)" class="p-4 border-t border-white/10 bg-[#121826] flex space-x-3">
                <input id="msg-input" type="text" placeholder="Type a message..." class="flex-1 bg-[#03050c] border border-white/10 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-orange-500">
                <button type="submit" class="px-6 bg-orange-600 hover:bg-orange-500 rounded-xl font-semibold text-xs text-white transition cursor-pointer shadow-lg shadow-orange-600/20">Send</button>
              </form>
            ` : `
              <div class="flex-1 flex items-center justify-center p-8 text-center text-gray-500">
                <div>
                  <h2 class="text-lg font-bold text-gray-300">Select an accepted friend to start messaging</h2>
                  <p class="text-xs text-gray-500 mt-1">Search user, send a friend request, and wait for acceptance to chat.</p>
                </div>
              </div>
            `}
          </div>
        </div>

        ${showFeedbackModal ? `
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-card p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl border border-white/10">
              <h3 class="font-bold text-sm">Send Feedback</h3>
              <textarea rows="3" oninput="handleFeedbackInput(event)" placeholder="Write feedback..." class="w-full bg-[#03050c] border border-white/10 rounded-xl p-3 text-xs text-white outline-none focus:border-orange-500 resize-none">${feedbackText}</textarea>
              <div class="flex space-x-2">
                <button onclick="submitFeedback()" class="flex-1 py-2 bg-orange-600 rounded-xl text-xs font-semibold text-white cursor-pointer shadow-lg shadow-orange-600/30">Submit</button>
                <button onclick="toggleFeedback(false)" class="flex-1 py-2 bg-white/10 rounded-xl text-xs font-semibold text-gray-300 cursor-pointer">Cancel</button>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    render();
  </script>
</body>
</html>
